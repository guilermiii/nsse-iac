<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 520" width="100%" height="100%">
    
    <defs>
        <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#1E293B"/>
            <stop offset="100%" stop-color="#0F172A"/>
        </linearGradient>
        <linearGradient id="awsOrange" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FF9900"/>
            <stop offset="100%" stop-color="#E88200"/>
        </linearGradient>
        <linearGradient id="awsBlue" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0284C7"/>
            <stop offset="100%" stop-color="#0369A1"/>
        </linearGradient>
        <linearGradient id="awsGreen" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#10B981"/>
            <stop offset="100%" stop-color="#047857"/>
        </linearGradient>
        <linearGradient id="awsPurple" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#8B5CF6"/>
            <stop offset="100%" stop-color="#6D28D9"/>
        </linearGradient>
        <linearGradient id="awsRed" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#EF4444"/>
            <stop offset="100%" stop-color="#B91C1C"/>
        </linearGradient>
        <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
            <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.08" flood-color="#0F172A"/>
        </filter>
        <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284C7" />
        </marker>
        <marker id="arrowOrange" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#FF9900" />
        </marker>
        <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#10B981" />
        </marker>
        <marker id="arrowRed" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#EF4444" />
        </marker>
    </defs>

    <rect width="920" height="520" fill="#F8FAFC" rx="12"/>
    <text x="460" y="45" font-family="system-ui, sans-serif" font-size="22" font-weight="bold" fill="#0F172A" text-anchor="middle">Arquitetura Multi-AZ: Alta Disponibilidade e Resiliência</text>
    <text x="460" y="70" font-family="system-ui, sans-serif" font-size="14" fill="#64748B" text-anchor="middle">Distribuição redundante em datacenters fisicamente isolados em us-east-1</text>

    <!-- VPC Box -->
    <rect x="40" y="95" width="840" height="400" rx="12" fill="#FFFFFF" stroke="#FF9900" stroke-width="2" filter="url(#shadow)"/>
    <text x="70" y="125" font-family="system-ui, sans-serif" font-size="15" font-weight="bold" fill="#92400E">VPC nsse-vpc (10.0.0.0/24)</text>

    <!-- AZ A -->
    <rect x="65" y="145" width="375" height="325" rx="8" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="4,4"/>
    <rect x="65" y="145" width="375" height="32" rx="8" fill="#F1F5F9"/>
    <text x="252" y="166" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#334155" text-anchor="middle">Zona de Disponibilidade: us-east-1a (DC 1)</text>

    <!-- Subnet Public A -->
    <rect x="85" y="190" width="335" height="110" rx="6" fill="#EFF6FF" stroke="#3B82F6"/>
    <text x="100" y="215" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#1D4ED8">Subnet Pública (10.0.0.0/27)</text>
    <rect x="100" y="230" width="130" height="55" rx="4" fill="#DBEAFE"/>
    <text x="165" y="253" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#1E40AF" text-anchor="middle">NAT Gateway A</text>
    <text x="165" y="270" font-family="system-ui, sans-serif" font-size="9" fill="#1E40AF" text-anchor="middle">Elastic IP Dedicado</text>

    <!-- Subnet Private A -->
    <rect x="85" y="320" width="335" height="135" rx="6" fill="#F0FDF4" stroke="#10B981"/>
    <text x="100" y="345" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#065F46">Subnet Privada (10.0.0.32/27)</text>
    <rect x="100" y="360" width="140" height="80" rx="4" fill="#DCFCE7"/>
    <text x="170" y="385" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#15803D" text-anchor="middle">EC2 Control Plane</text>
    <text x="170" y="405" font-family="system-ui, sans-serif" font-size="10" fill="#166534" text-anchor="middle">Sem IP público</text>
    <text x="170" y="423" font-family="system-ui, sans-serif" font-size="10" fill="#166534" text-anchor="middle">SSM Ativo</text>

    <!-- AZ B -->
    <rect x="480" y="145" width="375" height="325" rx="8" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="4,4"/>
    <rect x="480" y="145" width="375" height="32" rx="8" fill="#F1F5F9"/>
    <text x="667" y="166" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#334155" text-anchor="middle">Zona de Disponibilidade: us-east-1b (DC 2)</text>

    <!-- Subnet Public B -->
    <rect x="500" y="190" width="335" height="110" rx="6" fill="#EFF6FF" stroke="#3B82F6"/>
    <text x="515" y="215" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#1D4ED8">Subnet Pública (10.0.0.64/27)</text>
    <rect x="515" y="230" width="130" height="55" rx="4" fill="#DBEAFE"/>
    <text x="580" y="253" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#1E40AF" text-anchor="middle">NAT Gateway B</text>
    <text x="580" y="270" font-family="system-ui, sans-serif" font-size="9" fill="#1E40AF" text-anchor="middle">Elastic IP Dedicado</text>

    <!-- Subnet Private B -->
    <rect x="500" y="320" width="335" height="135" rx="6" fill="#F0FDF4" stroke="#10B981"/>
    <text x="515" y="345" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#065F46">Subnet Privada (10.0.0.96/27)</text>
    <rect x="515" y="360" width="140" height="80" rx="4" fill="#DCFCE7"/>
    <text x="585" y="385" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#15803D" text-anchor="middle">EC2 Worker Nodes</text>
    <text x="585" y="405" font-family="system-ui, sans-serif" font-size="10" fill="#166534" text-anchor="middle">Sem IP público</text>
    <text x="585" y="423" font-family="system-ui, sans-serif" font-size="10" fill="#166534" text-anchor="middle">SSM Ativo</text>
</svg>
