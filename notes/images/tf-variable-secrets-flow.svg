<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="100%" height="100%">
    
    <defs>
        <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#1E293B"/>
            <stop offset="100%" stop-color="#0F172A"/>
        </linearGradient>
        <linearGradient id="awsOrange" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FF9900"/>
            <stop offset="100%" stop-color="#E88200"/>
        </linearGradient>
        <linearGradient id="awsBlue" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0284C7"/>
            <stop offset="100%" stop-color="#0369A1"/>
        </linearGradient>
        <linearGradient id="awsGreen" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#10B981"/>
            <stop offset="100%" stop-color="#047857"/>
        </linearGradient>
        <linearGradient id="awsPurple" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#8B5CF6"/>
            <stop offset="100%" stop-color="#6D28D9"/>
        </linearGradient>
        <linearGradient id="awsRed" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#EF4444"/>
            <stop offset="100%" stop-color="#B91C1C"/>
        </linearGradient>
        <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
            <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.08" flood-color="#0F172A"/>
        </filter>
        <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284C7" />
        </marker>
        <marker id="arrowOrange" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#FF9900" />
        </marker>
        <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#10B981" />
        </marker>
        <marker id="arrowRed" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#EF4444" />
        </marker>
    </defs>

    <rect width="900" height="500" fill="#F8FAFC" rx="12"/>
    <text x="450" y="45" font-family="system-ui, sans-serif" font-size="22" font-weight="bold" fill="#0F172A" text-anchor="middle">Organização de Arquivos e Gestão Segura de Variáveis</text>
    <text x="450" y="70" font-family="system-ui, sans-serif" font-size="14" fill="#64748B" text-anchor="middle">Separação de responsabilidades e fluxo de segredos entre Git, local e CI/CD</text>

    <!-- Git Publico -->
    <rect x="50" y="100" width="240" height="340" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2" filter="url(#shadow)"/>
    <rect x="50" y="100" width="240" height="40" rx="10" fill="#F1F5F9"/>
    <text x="170" y="125" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#334155" text-anchor="middle">📦 Versionado no Git</text>

    <rect x="70" y="160" width="200" height="60" rx="6" fill="#F8FAFC" stroke="#94A3B8"/>
    <text x="170" y="185" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#1E293B" text-anchor="middle">variables.tf</text>
    <text x="170" y="205" font-family="system-ui, sans-serif" font-size="11" fill="#64748B" text-anchor="middle">Declara tipos, descriptions e defaults</text>

    <rect x="70" y="240" width="200" height="60" rx="6" fill="#F8FAFC" stroke="#94A3B8"/>
    <text x="170" y="265" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#1E293B" text-anchor="middle">terraform.tfvars.example</text>
    <text x="170" y="285" font-family="system-ui, sans-serif" font-size="11" fill="#64748B" text-anchor="middle">Valores fictícios e guia de uso</text>

    <rect x="70" y="320" width="200" height="90" rx="6" fill="#ECFDF5" stroke="#10B981"/>
    <text x="170" y="345" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#065F46" text-anchor="middle">main.tf / outputs.tf</text>
    <text x="170" y="365" font-family="system-ui, sans-serif" font-size="11" fill="#047857" text-anchor="middle">Código da infraestrutura</text>
    <text x="170" y="385" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#047857" text-anchor="middle">✓ ZERO segredos hardcoded</text>

    <!-- Ambiente Privado / Local -->
    <rect x="330" y="100" width="240" height="340" rx="10" fill="#FFFFFF" stroke="#EF4444" stroke-width="2" filter="url(#shadow)"/>
    <rect x="330" y="100" width="240" height="40" rx="10" fill="#FEE2E2"/>
    <text x="450" y="125" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#B91C1C" text-anchor="middle">🚫 Ignorado no .gitignore</text>

    <rect x="350" y="160" width="200" height="85" rx="6" fill="#FEF2F2" stroke="#F87171"/>
    <text x="450" y="185" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#991B1B" text-anchor="middle">terraform.tfvars</text>
    <text x="450" y="205" font-family="system-ui, sans-serif" font-size="11" fill="#7F1D1D" text-anchor="middle">IDs reais, tags de projeto,</text>
    <text x="450" y="223" font-family="system-ui, sans-serif" font-size="11" fill="#7F1D1D" text-anchor="middle">e credenciais locais</text>

    <rect x="350" y="270" width="200" height="85" rx="6" fill="#FEF2F2" stroke="#F87171"/>
    <text x="450" y="295" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#991B1B" text-anchor="middle">.terraform.tfstate.d</text>
    <text x="450" y="315" font-family="system-ui, sans-serif" font-size="11" fill="#7F1D1D" text-anchor="middle">Arquivos de cache local</text>
    <text x="450" y="333" font-family="system-ui, sans-serif" font-size="11" fill="#7F1D1D" text-anchor="middle">e lock de providers</text>

    <!-- CI/CD & Producao -->
    <rect x="610" y="100" width="240" height="340" rx="10" fill="#FFFFFF" stroke="#0284C7" stroke-width="2" filter="url(#shadow)"/>
    <rect x="610" y="100" width="240" height="40" rx="10" fill="#E0F2FE"/>
    <text x="730" y="125" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#0369A1" text-anchor="middle">🔐 CI/CD &amp; Nuvem</text>

    <rect x="630" y="160" width="200" height="85" rx="6" fill="#F0F9FF" stroke="#38BDF8"/>
    <text x="730" y="185" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#0C4A6E" text-anchor="middle">GitHub Secrets</text>
    <text x="730" y="205" font-family="system-ui, sans-serif" font-size="11" fill="#0369A1" text-anchor="middle">AWS_ROLE_ARN,</text>
    <text x="730" y="223" font-family="system-ui, sans-serif" font-size="11" fill="#0369A1" text-anchor="middle">EXTERNAL_ID, Chaves OIDC</text>

    <rect x="630" y="270" width="200" height="85" rx="6" fill="#F0F9FF" stroke="#38BDF8"/>
    <text x="730" y="295" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#0C4A6E" text-anchor="middle">Vault / AWS Secrets</text>
    <text x="730" y="315" font-family="system-ui, sans-serif" font-size="11" fill="#0369A1" text-anchor="middle">Injeção dinâmica via</text>
    <text x="730" y="333" font-family="system-ui, sans-serif" font-size="11" fill="#0369A1" text-anchor="middle">TF_VAR_nome_variavel</text>
</svg>
