<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 540" width="100%" height="100%">
    
    <defs>
        <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#1E293B"/>
            <stop offset="100%" stop-color="#0F172A"/>
        </linearGradient>
        <linearGradient id="awsOrange" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FF9900"/>
            <stop offset="100%" stop-color="#E88200"/>
        </linearGradient>
        <linearGradient id="awsBlue" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0284C7"/>
            <stop offset="100%" stop-color="#0369A1"/>
        </linearGradient>
        <linearGradient id="awsGreen" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#10B981"/>
            <stop offset="100%" stop-color="#047857"/>
        </linearGradient>
        <linearGradient id="awsPurple" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#8B5CF6"/>
            <stop offset="100%" stop-color="#6D28D9"/>
        </linearGradient>
        <linearGradient id="awsRed" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#EF4444"/>
            <stop offset="100%" stop-color="#B91C1C"/>
        </linearGradient>
        <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
            <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.08" flood-color="#0F172A"/>
        </filter>
        <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284C7" />
        </marker>
        <marker id="arrowOrange" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#FF9900" />
        </marker>
        <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#10B981" />
        </marker>
        <marker id="arrowRed" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#EF4444" />
        </marker>
    </defs>

    <rect width="920" height="540" fill="#F8FAFC" rx="12"/>
    <text x="460" y="45" font-family="system-ui, sans-serif" font-size="22" font-weight="bold" fill="#0F172A" text-anchor="middle">Acesso Seguro: SSH Tradicional vs AWS Systems Manager (SSM)</text>
    <text x="460" y="70" font-family="system-ui, sans-serif" font-size="14" fill="#64748B" text-anchor="middle">Eliminação da porta 22 e transição para arquitetura Zero Trust auditável</text>

    <!-- Top: SSH Legado -->
    <rect x="50" y="100" width="820" height="170" rx="10" fill="#FFFFFF" stroke="#EF4444" stroke-width="2" filter="url(#shadow)"/>
    <rect x="50" y="100" width="820" height="35" rx="10" fill="#FEE2E2"/>
    <text x="75" y="123" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#B91C1C">❌ Acesso Tradicional via SSH (Inseguro / Legado)</text>

    <rect x="75" y="150" width="140" height="85" rx="6" fill="#F8FAFC" stroke="#CBD5E1"/>
    <text x="145" y="180" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#334155" text-anchor="middle">Dev / Operador</text>
    <text x="145" y="200" font-family="system-ui, sans-serif" font-size="10" fill="#64748B" text-anchor="middle">Chave .pem no disco</text>

    <path d="M 215 190 L 315 190" stroke="#EF4444" stroke-width="2" marker-end="url(#arrowRed)"/>
    <text x="265" y="180" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#DC2626" text-anchor="middle">Porta 22 Aberta</text>

    <rect x="325" y="150" width="160" height="85" rx="6" fill="#FEE2E2" stroke="#F87171"/>
    <text x="405" y="180" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#991B1B" text-anchor="middle">Bastion Host</text>
    <text x="405" y="200" font-family="system-ui, sans-serif" font-size="10" fill="#7F1D1D" text-anchor="middle">IP Público Exposto</text>

    <path d="M 485 190 L 585 190" stroke="#EF4444" stroke-width="2" marker-end="url(#arrowRed)"/>

    <rect x="595" y="150" width="250" height="85" rx="6" fill="#F8FAFC" stroke="#CBD5E1"/>
    <text x="720" y="175" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#334155" text-anchor="middle">Riscos e Fragilidades:</text>
    <text x="720" y="195" font-family="system-ui, sans-serif" font-size="10" fill="#B91C1C" text-anchor="middle">• Port scans e ataques de brute-force</text>
    <text x="720" y="210" font-family="system-ui, sans-serif" font-size="10" fill="#B91C1C" text-anchor="middle">• Chaves privadas vazadas ou compartilhadas</text>

    <!-- Bottom: SSM Moderno -->
    <rect x="50" y="300" width="820" height="210" rx="10" fill="#FFFFFF" stroke="#10B981" stroke-width="2" filter="url(#shadow)"/>
    <rect x="50" y="300" width="820" height="35" rx="10" fill="#ECFDF5"/>
    <text x="75" y="323" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#065F46">✅ Acesso Moderno via AWS Systems Manager Session Manager (Padrão Adotado no NSSE)</text>

    <rect x="75" y="355" width="140" height="120" rx="6" fill="#F8FAFC" stroke="#CBD5E1"/>
    <text x="145" y="390" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#334155" text-anchor="middle">Dev / Operador</text>
    <text x="145" y="415" font-family="system-ui, sans-serif" font-size="10" fill="#0284C7" text-anchor="middle">aws ssm</text>
    <text x="145" y="430" font-family="system-ui, sans-serif" font-size="10" fill="#0284C7" text-anchor="middle">start-session</text>
    <text x="145" y="455" font-family="system-ui, sans-serif" font-size="9" fill="#15803D" text-anchor="middle">Autenticado via IAM/MFA</text>

    <path d="M 215 415 L 315 415" stroke="#10B981" stroke-width="2" marker-end="url(#arrowGreen)"/>

    <rect x="325" y="355" width="200" height="120" rx="6" fill="#F0FDF4" stroke="#10B981"/>
    <text x="425" y="385" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#065F46" text-anchor="middle">AWS Systems Manager</text>
    <text x="425" y="405" font-family="system-ui, sans-serif" font-size="10" fill="#047857" text-anchor="middle">Canal Criptografado TLS 443</text>
    <text x="425" y="430" font-family="system-ui, sans-serif" font-size="10" fill="#334155" text-anchor="middle">Auditoria total no CloudTrail</text>
    <text x="425" y="455" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" fill="#15803D" text-anchor="middle">Conexão Outbound Iniciada pelo Agente</text>

    <path d="M 525 415 L 625 415" stroke="#10B981" stroke-width="2" marker-end="url(#arrowGreen)"/>

    <rect x="635" y="355" width="210" height="120" rx="6" fill="#F0FDF4" stroke="#10B981"/>
    <text x="740" y="385" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#065F46" text-anchor="middle">Instância EC2 Privada</text>
    <text x="740" y="410" font-family="system-ui, sans-serif" font-size="10" fill="#047857" text-anchor="middle">Porta 22 FECHADA no SG</text>
    <text x="740" y="430" font-family="system-ui, sans-serif" font-size="10" fill="#047857" text-anchor="middle">Sem IP público</text>
    <text x="740" y="455" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#15803D" text-anchor="middle">Agente SSM ativo via user_data</text>
</svg>
