<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="100%" height="100%">
    
    <defs>
        <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#1E293B"/>
            <stop offset="100%" stop-color="#0F172A"/>
        </linearGradient>
        <linearGradient id="awsOrange" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FF9900"/>
            <stop offset="100%" stop-color="#E88200"/>
        </linearGradient>
        <linearGradient id="awsBlue" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0284C7"/>
            <stop offset="100%" stop-color="#0369A1"/>
        </linearGradient>
        <linearGradient id="awsGreen" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#10B981"/>
            <stop offset="100%" stop-color="#047857"/>
        </linearGradient>
        <linearGradient id="awsPurple" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#8B5CF6"/>
            <stop offset="100%" stop-color="#6D28D9"/>
        </linearGradient>
        <linearGradient id="awsRed" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#EF4444"/>
            <stop offset="100%" stop-color="#B91C1C"/>
        </linearGradient>
        <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
            <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.08" flood-color="#0F172A"/>
        </filter>
        <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284C7" />
        </marker>
        <marker id="arrowOrange" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#FF9900" />
        </marker>
        <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#10B981" />
        </marker>
        <marker id="arrowRed" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#EF4444" />
        </marker>
    </defs>

    <rect width="900" height="520" fill="#F8FAFC" rx="12"/>
    <text x="450" y="45" font-family="system-ui, sans-serif" font-size="22" font-weight="bold" fill="#0F172A" text-anchor="middle">Terraform Remote Backend &amp; State Locking na AWS</text>
    <text x="450" y="70" font-family="system-ui, sans-serif" font-size="14" fill="#64748B" text-anchor="middle">Comparativo entre a arquitetura legada (DynamoDB) e a abordagem moderna (S3 Nativo)</text>

    <!-- Legado -->
    <rect x="50" y="100" width="370" height="230" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2" filter="url(#shadow)"/>
    <rect x="50" y="100" width="370" height="42" rx="10" fill="#F1F5F9"/>
    <text x="235" y="127" font-family="system-ui, sans-serif" font-size="15" font-weight="bold" fill="#475569" text-anchor="middle">Abordagem Tradicional / Legada</text>
    <rect x="75" y="160" width="140" height="70" rx="8" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5"/>
    <text x="145" y="190" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#065F46" text-anchor="middle">AWS S3</text>
    <text x="145" y="210" font-family="system-ui, sans-serif" font-size="11" fill="#047857" text-anchor="middle">Armazena .tfstate</text>

    <text x="235" y="200" font-family="system-ui, sans-serif" font-size="18" fill="#64748B" text-anchor="middle">+</text>

    <rect x="255" y="160" width="140" height="70" rx="8" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="325" y="190" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#92400E" text-anchor="middle">AWS DynamoDB</text>
    <text x="325" y="210" font-family="system-ui, sans-serif" font-size="11" fill="#B45309" text-anchor="middle">Tabela para LockID</text>

    <text x="235" y="265" font-family="system-ui, sans-serif" font-size="12" fill="#64748B" text-anchor="middle">Exige gerenciamento de 2 recursos independentes</text>
    <text x="235" y="285" font-family="system-ui, sans-serif" font-size="12" fill="#DC2626" font-weight="600" text-anchor="middle">Custo extra de infraestrutura e permissões IAM</text>

    <!-- Moderno -->
    <rect x="480" y="100" width="370" height="230" rx="10" fill="#FFFFFF" stroke="#0284C7" stroke-width="2" filter="url(#shadow)"/>
    <rect x="480" y="100" width="370" height="42" rx="10" fill="#E0F2FE"/>
    <text x="665" y="127" font-family="system-ui, sans-serif" font-size="15" font-weight="bold" fill="#0369A1" text-anchor="middle">Abordagem Moderna (Terraform >= 1.10)</text>
    <rect x="530" y="160" width="270" height="70" rx="8" fill="#F0FDF4" stroke="#16A34A" stroke-width="2"/>
    <text x="665" y="190" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#15803D" text-anchor="middle">AWS S3 Nativo (use_lockfile = true)</text>
    <text x="665" y="210" font-family="system-ui, sans-serif" font-size="12" fill="#166534" text-anchor="middle">Estado e Lockfile no mesmo bucket</text>

    <text x="665" y="265" font-family="system-ui, sans-serif" font-size="12" fill="#0369A1" font-weight="600" text-anchor="middle">✓ Sem necessidade de DynamoDB</text>
    <text x="665" y="285" font-family="system-ui, sans-serif" font-size="12" fill="#15803D" font-weight="bold" text-anchor="middle">✓ Menor custo, menor atrito e nativo do S3</text>

    <!-- Fluxo de Execucao -->
    <rect x="50" y="360" width="800" height="130" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="75" y="390" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1E293B">Fluxo de Execução com State Locking:</text>

    <!-- Steps -->
    <rect x="75" y="410" width="160" height="55" rx="6" fill="#F8FAFC" stroke="#CBD5E1"/>
    <text x="155" y="433" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#334155" text-anchor="middle">1. terraform apply</text>
    <text x="155" y="450" font-family="system-ui, sans-serif" font-size="10" fill="#64748B" text-anchor="middle">Inicia operação</text>

    <line x1="235" y1="437" x2="275" y2="437" stroke="#0284C7" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="280" y="410" width="160" height="55" rx="6" fill="#FEF3C7" stroke="#F59E0B"/>
    <text x="360" y="433" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#92400E" text-anchor="middle">2. Aquisição de Lock</text>
    <text x="360" y="450" font-family="system-ui, sans-serif" font-size="10" fill="#B45309" text-anchor="middle">Bloqueia concorrência</text>

    <line x1="440" y1="437" x2="480" y2="437" stroke="#0284C7" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="485" y="410" width="160" height="55" rx="6" fill="#ECFDF5" stroke="#10B981"/>
    <text x="565" y="433" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#065F46" text-anchor="middle">3. Grava .tfstate</text>
    <text x="565" y="450" font-family="system-ui, sans-serif" font-size="10" fill="#047857" text-anchor="middle">Atualiza estado no S3</text>

    <line x1="645" y1="437" x2="685" y2="437" stroke="#0284C7" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="690" y="410" width="145" height="55" rx="6" fill="#EFF6FF" stroke="#3B82F6"/>
    <text x="762" y="433" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#1D4ED8" text-anchor="middle">4. Libera Lock</text>
    <text x="762" y="450" font-family="system-ui, sans-serif" font-size="10" fill="#2563EB" text-anchor="middle">Permite novas runs</text>
</svg>
