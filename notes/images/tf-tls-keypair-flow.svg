<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="100%">
    
    <defs>
        <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#1E293B"/>
            <stop offset="100%" stop-color="#0F172A"/>
        </linearGradient>
        <linearGradient id="awsOrange" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FF9900"/>
            <stop offset="100%" stop-color="#E88200"/>
        </linearGradient>
        <linearGradient id="awsBlue" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0284C7"/>
            <stop offset="100%" stop-color="#0369A1"/>
        </linearGradient>
        <linearGradient id="awsGreen" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#10B981"/>
            <stop offset="100%" stop-color="#047857"/>
        </linearGradient>
        <linearGradient id="awsPurple" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#8B5CF6"/>
            <stop offset="100%" stop-color="#6D28D9"/>
        </linearGradient>
        <linearGradient id="awsRed" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#EF4444"/>
            <stop offset="100%" stop-color="#B91C1C"/>
        </linearGradient>
        <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
            <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.08" flood-color="#0F172A"/>
        </filter>
        <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284C7" />
        </marker>
        <marker id="arrowOrange" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#FF9900" />
        </marker>
        <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#10B981" />
        </marker>
        <marker id="arrowRed" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#EF4444" />
        </marker>
    </defs>

    <rect width="900" height="480" fill="#F8FAFC" rx="12"/>
    <text x="450" y="45" font-family="system-ui, sans-serif" font-size="22" font-weight="bold" fill="#0F172A" text-anchor="middle">Provider TLS e Injeção de Chaves na AWS</text>
    <text x="450" y="70" font-family="system-ui, sans-serif" font-size="14" fill="#64748B" text-anchor="middle">Criação automatizada de pares de chave SSH e estratégia de contingência</text>

    <!-- TLS Provider Block -->
    <rect x="60" y="110" width="240" height="150" rx="10" fill="#FFFFFF" stroke="#8B5CF6" stroke-width="2" filter="url(#shadow)"/>
    <rect x="60" y="110" width="240" height="35" rx="10" fill="#EDE9FE"/>
    <text x="180" y="133" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#6D28D9" text-anchor="middle">hashicorp/tls Provider</text>

    <text x="80" y="175" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#1E293B">tls_private_key.this</text>
    <text x="80" y="195" font-family="system-ui, sans-serif" font-size="11" fill="#64748B">algorithm = "RSA" (ou ED25519)</text>
    <text x="80" y="215" font-family="system-ui, sans-serif" font-size="11" fill="#64748B">Gera em memória:</text>
    <text x="80" y="235" font-family="system-ui, sans-serif" font-size="11" fill="#0284C7">→ public_key_openssh</text>

    <!-- Arrow Public Key -->
    <path d="M 300 185 L 380 185" stroke="#0284C7" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
    <text x="340" y="175" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#0284C7" text-anchor="middle">Chave Pública</text>

    <!-- AWS Key Pair -->
    <rect x="390" y="110" width="240" height="150" rx="10" fill="#FFFFFF" stroke="#FF9900" stroke-width="2" filter="url(#shadow)"/>
    <rect x="390" y="110" width="240" height="35" rx="10" fill="#FEF3C7"/>
    <text x="510" y="133" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#B45309" text-anchor="middle">AWS EC2 Key Pair</text>

    <text x="410" y="175" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#1E293B">aws_key_pair.this</text>
    <text x="410" y="195" font-family="system-ui, sans-serif" font-size="11" fill="#64748B">key_name = var.key_name</text>
    <text x="410" y="215" font-family="system-ui, sans-serif" font-size="11" fill="#64748B">public_key = tls.public_key</text>
    <text x="410" y="235" font-family="system-ui, sans-serif" font-size="11" fill="#15803D">Disponível para instâncias</text>

    <!-- Arrow to EC2 -->
    <path d="M 630 185 L 710 185" stroke="#FF9900" stroke-width="2" fill="none" marker-end="url(#arrowOrange)"/>

    <!-- EC2 Instances -->
    <rect x="720" y="110" width="130" height="150" rx="10" fill="#FFFFFF" stroke="#10B981" stroke-width="2" filter="url(#shadow)"/>
    <text x="785" y="165" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#065F46" text-anchor="middle">Instâncias EC2</text>
    <text x="785" y="195" font-family="system-ui, sans-serif" font-size="11" fill="#047857" text-anchor="middle">Injetada no</text>
    <text x="785" y="215" font-family="system-ui, sans-serif" font-size="11" fill="#047857" text-anchor="middle">authorized_keys</text>

    <!-- Bottom Notice Card -->
    <rect x="60" y="300" width="790" height="140" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="60" y="300" width="790" height="35" rx="10" fill="#F8FAFC"/>
    <text x="80" y="323" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#334155">Decisão Arquitetural do Projeto NSSE:</text>

    <text x="80" y="360" font-family="system-ui, sans-serif" font-size="12" fill="#1E293B" font-weight="bold">1. Acesso Primário:</text>
    <text x="210" y="360" font-family="system-ui, sans-serif" font-size="12" fill="#475569">AWS Systems Manager (SSM) Session Manager. Porta 22 fechada no Security Group.</text>

    <text x="80" y="390" font-family="system-ui, sans-serif" font-size="12" fill="#1E293B" font-weight="bold">2. Papel da Key Pair:</text>
    <text x="210" y="390" font-family="system-ui, sans-serif" font-size="12" fill="#475569">Mantida associada às máquinas apenas como plano de contingência (fallback) em caso de falha do agente SSM.</text>

    <text x="80" y="420" font-family="system-ui, sans-serif" font-size="12" fill="#DC2626" font-weight="bold">3. Segurança:</text>
    <text x="210" y="420" font-family="system-ui, sans-serif" font-size="12" fill="#475569">A chave privada NUNCA deve ser commitada no Git. Armazenada apenas em local seguro ou gerenciador de segredos.</text>
</svg>
