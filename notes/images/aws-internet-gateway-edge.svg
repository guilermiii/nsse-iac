<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="100%">
    
    <defs>
        <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#1E293B"/>
            <stop offset="100%" stop-color="#0F172A"/>
        </linearGradient>
        <linearGradient id="awsOrange" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FF9900"/>
            <stop offset="100%" stop-color="#E88200"/>
        </linearGradient>
        <linearGradient id="awsBlue" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0284C7"/>
            <stop offset="100%" stop-color="#0369A1"/>
        </linearGradient>
        <linearGradient id="awsGreen" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#10B981"/>
            <stop offset="100%" stop-color="#047857"/>
        </linearGradient>
        <linearGradient id="awsPurple" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#8B5CF6"/>
            <stop offset="100%" stop-color="#6D28D9"/>
        </linearGradient>
        <linearGradient id="awsRed" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#EF4444"/>
            <stop offset="100%" stop-color="#B91C1C"/>
        </linearGradient>
        <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
            <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.08" flood-color="#0F172A"/>
        </filter>
        <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284C7" />
        </marker>
        <marker id="arrowOrange" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#FF9900" />
        </marker>
        <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#10B981" />
        </marker>
        <marker id="arrowRed" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#EF4444" />
        </marker>
    </defs>

    <rect width="900" height="480" fill="#F8FAFC" rx="12"/>
    <text x="450" y="45" font-family="system-ui, sans-serif" font-size="22" font-weight="bold" fill="#0F172A" text-anchor="middle">Internet Gateway (IGW): Roteador de Borda da VPC</text>
    <text x="450" y="70" font-family="system-ui, sans-serif" font-size="14" fill="#64748B" text-anchor="middle">O que diferencia tecnicamente uma sub-rede pública de uma sub-rede privada</text>

    <rect x="60" y="110" width="370" height="240" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2" filter="url(#shadow)"/>
    <rect x="60" y="110" width="370" height="40" rx="10" fill="#DBEAFE"/>
    <text x="245" y="135" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1E40AF" text-anchor="middle">Subnet Pública</text>
    <text x="80" y="180" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#1E293B">Tabela de Roteamento:</text>
    <text x="80" y="205" font-family="system-ui, sans-serif" font-size="12" fill="#2563EB">Destino: 0.0.0.0/0 → Alvo: igw-xxxxxxx</text>
    <text x="80" y="235" font-family="system-ui, sans-serif" font-size="12" fill="#475569">Recursos possuem ou podem receber IP público</text>
    <text x="80" y="265" font-family="system-ui, sans-serif" font-size="12" fill="#475569">Exemplos: Bastion Hosts, Load Balancers (ALB),</text>
    <text x="80" y="285" font-family="system-ui, sans-serif" font-size="12" fill="#475569">NAT Gateways com Elastic IP.</text>
    <text x="80" y="325" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#15803D">✓ Acesso bidirecional à Internet</text>

    <rect x="470" y="110" width="370" height="240" rx="10" fill="#F0FDF4" stroke="#10B981" stroke-width="2" filter="url(#shadow)"/>
    <rect x="470" y="110" width="370" height="40" rx="10" fill="#DCFCE7"/>
    <text x="655" y="135" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#065F46" text-anchor="middle">Subnet Privada</text>
    <text x="490" y="180" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#1E293B">Tabela de Roteamento:</text>
    <text x="490" y="205" font-family="system-ui, sans-serif" font-size="12" fill="#059669">Destino: 0.0.0.0/0 → Alvo: nat-xxxxxxx</text>
    <text x="490" y="235" font-family="system-ui, sans-serif" font-size="12" fill="#B91C1C" font-weight="bold">🚫 NÃO possui rota para o Internet Gateway!</text>
    <text x="490" y="265" font-family="system-ui, sans-serif" font-size="12" fill="#475569">Instâncias recebem apenas IPs privados da VPC</text>
    <text x="490" y="285" font-family="system-ui, sans-serif" font-size="12" fill="#475569">Exemplos: Bancos de dados, Control Plane,</text>
    <text x="490" y="305" font-family="system-ui, sans-serif" font-size="12" fill="#475569">Worker Nodes do Kubernetes / cluster.</text>
    <text x="490" y="330" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#047857">✓ Comunicação de saída segura e controlada</text>

    <!-- Bottom summary -->
    <rect x="60" y="380" width="780" height="70" rx="8" fill="#FFFFFF" stroke="#CBD5E1" filter="url(#shadow)"/>
    <text x="450" y="410" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#0F172A" text-anchor="middle">Regra de Ouro da Arquitetura AWS:</text>
    <text x="450" y="433" font-family="system-ui, sans-serif" font-size="12" fill="#475569" text-anchor="middle">A única diferença técnica entre uma sub-rede pública e uma privada é a presença de uma rota para o Internet Gateway.</text>
</svg>
