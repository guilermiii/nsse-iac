<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 540" width="100%" height="100%">
    
    <defs>
        <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#1E293B"/>
            <stop offset="100%" stop-color="#0F172A"/>
        </linearGradient>
        <linearGradient id="awsOrange" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FF9900"/>
            <stop offset="100%" stop-color="#E88200"/>
        </linearGradient>
        <linearGradient id="awsBlue" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0284C7"/>
            <stop offset="100%" stop-color="#0369A1"/>
        </linearGradient>
        <linearGradient id="awsGreen" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#10B981"/>
            <stop offset="100%" stop-color="#047857"/>
        </linearGradient>
        <linearGradient id="awsPurple" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#8B5CF6"/>
            <stop offset="100%" stop-color="#6D28D9"/>
        </linearGradient>
        <linearGradient id="awsRed" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#EF4444"/>
            <stop offset="100%" stop-color="#B91C1C"/>
        </linearGradient>
        <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
            <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.08" flood-color="#0F172A"/>
        </filter>
        <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284C7" />
        </marker>
        <marker id="arrowOrange" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#FF9900" />
        </marker>
        <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#10B981" />
        </marker>
        <marker id="arrowRed" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#EF4444" />
        </marker>
    </defs>

    <rect width="920" height="540" fill="#F8FAFC" rx="12"/>
    <text x="460" y="45" font-family="system-ui, sans-serif" font-size="22" font-weight="bold" fill="#0F172A" text-anchor="middle">NAT Gateway: Tráfego Egress (Saída) vs Ingress (Entrada)</text>
    <text x="460" y="70" font-family="system-ui, sans-serif" font-size="14" fill="#64748B" text-anchor="middle">Como o NAT Gateway protege instâncias privadas e permite download seguro de pacotes</text>

    <!-- Flow diagram Egress -->
    <rect x="50" y="110" width="180" height="150" rx="8" fill="#F0FDF4" stroke="#10B981" stroke-width="2"/>
    <text x="140" y="140" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#065F46" text-anchor="middle">Instância Privada</text>
    <text x="140" y="165" font-family="system-ui, sans-serif" font-size="11" fill="#047857" text-anchor="middle">IP: 10.0.0.35</text>
    <text x="140" y="195" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#15803D" text-anchor="middle">Dispara:</text>
    <text x="140" y="215" font-family="system-ui, sans-serif" font-size="10" fill="#334155" text-anchor="middle">apt update / wget</text>

    <!-- Arrow to NAT -->
    <path d="M 230 185 L 320 185" stroke="#10B981" stroke-width="3" fill="none" marker-end="url(#arrowGreen)"/>
    <text x="275" y="175" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#047857" text-anchor="middle">Rota 0.0.0.0/0</text>

    <!-- NAT Gateway -->
    <rect x="330" y="110" width="190" height="150" rx="8" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
    <text x="425" y="140" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#1E40AF" text-anchor="middle">NAT Gateway</text>
    <text x="425" y="165" font-family="system-ui, sans-serif" font-size="11" fill="#1D4ED8" text-anchor="middle">(Na Subnet Pública)</text>
    <text x="425" y="195" font-family="system-ui, sans-serif" font-size="11" fill="#475569" text-anchor="middle">Elastic IP:</text>
    <text x="425" y="215" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#0F172A" text-anchor="middle">54.210.xx.xx</text>

    <!-- Arrow to IGW -->
    <path d="M 520 185 L 610 185" stroke="#10B981" stroke-width="3" fill="none" marker-end="url(#arrowGreen)"/>

    <!-- Internet Gateway -->
    <rect x="620" y="110" width="120" height="150" rx="8" fill="#FFFBEB" stroke="#F59E0B" stroke-width="2"/>
    <text x="680" y="150" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#92400E" text-anchor="middle">Internet</text>
    <text x="680" y="175" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#92400E" text-anchor="middle">Gateway</text>
    <text x="680" y="215" font-family="system-ui, sans-serif" font-size="11" fill="#B45309" text-anchor="middle">(Borda)</text>

    <!-- Arrow to Internet -->
    <path d="M 740 185 L 800 185" stroke="#10B981" stroke-width="3" fill="none" marker-end="url(#arrowGreen)"/>

    <!-- Internet -->
    <circle cx="850" cy="185" r="35" fill="#3B82F6"/>
    <text x="850" y="190" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Internet</text>

    <!-- Block Ingress Flow -->
    <rect x="50" y="300" width="820" height="200" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="50" y="300" width="820" height="35" rx="10" fill="#FEE2E2"/>
    <text x="75" y="323" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#991B1B">Segurança: Bloqueio de Conexões Não Solicitadas (Ingress)</text>

    <text x="75" y="365" font-family="system-ui, sans-serif" font-size="12" fill="#1E293B">Um atacante ou máquina externa na Internet NÃO consegue iniciar uma conexão direta com a instância privada.</text>
    <text x="75" y="390" font-family="system-ui, sans-serif" font-size="12" fill="#1E293B">O NAT Gateway atua de forma stateful unidirecional: pacotes externos que não correspondam a uma requisição</text>
    <text x="75" y="415" font-family="system-ui, sans-serif" font-size="12" fill="#1E293B">previamente aberta pela instância são imediatamente descartados.</text>

    <rect x="75" y="435" width="770" height="45" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="90" y="462" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#334155">Trade-off de Arquitetura:</text>
    <text x="245" y="462" font-family="system-ui, sans-serif" font-size="11" fill="#475569">1 NAT GW por AZ (Produção/HA com isolamento de falhas) vs. 1 NAT GW único Cross-AZ (Econômico para Dev/Test).</text>
</svg>
