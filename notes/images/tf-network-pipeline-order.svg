<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 540" width="100%" height="100%">
    
    <defs>
        <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#1E293B"/>
            <stop offset="100%" stop-color="#0F172A"/>
        </linearGradient>
        <linearGradient id="awsOrange" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FF9900"/>
            <stop offset="100%" stop-color="#E88200"/>
        </linearGradient>
        <linearGradient id="awsBlue" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0284C7"/>
            <stop offset="100%" stop-color="#0369A1"/>
        </linearGradient>
        <linearGradient id="awsGreen" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#10B981"/>
            <stop offset="100%" stop-color="#047857"/>
        </linearGradient>
        <linearGradient id="awsPurple" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#8B5CF6"/>
            <stop offset="100%" stop-color="#6D28D9"/>
        </linearGradient>
        <linearGradient id="awsRed" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#EF4444"/>
            <stop offset="100%" stop-color="#B91C1C"/>
        </linearGradient>
        <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
            <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.08" flood-color="#0F172A"/>
        </filter>
        <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284C7" />
        </marker>
        <marker id="arrowOrange" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#FF9900" />
        </marker>
        <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#10B981" />
        </marker>
        <marker id="arrowRed" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#EF4444" />
        </marker>
    </defs>

    <rect width="920" height="540" fill="#F8FAFC" rx="12"/>
    <text x="460" y="45" font-family="system-ui, sans-serif" font-size="22" font-weight="bold" fill="#0F172A" text-anchor="middle">Grafo de Dependência e Ordem de Provisionamento de Rede</text>
    <text x="460" y="70" font-family="system-ui, sans-serif" font-size="14" fill="#64748B" text-anchor="middle">Sequência necessária no Terraform para garantir resolução correta de rotas e gateways</text>

    <!-- Step 1 -->
    <rect x="40" y="110" width="240" height="80" rx="8" fill="#FFFFFF" stroke="#0284C7" stroke-width="2" filter="url(#shadow)"/>
    <rect x="40" y="110" width="40" height="80" rx="8" fill="#0284C7"/>
    <text x="60" y="155" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>
    <text x="160" y="140" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#0F172A">aws_vpc</text>
    <text x="160" y="165" font-family="system-ui, sans-serif" font-size="12" fill="#64748B">Cria a fronteira CIDR base</text>

    <!-- Arrow 1 to 2 -->
    <path d="M 280 150 L 330 150" stroke="#0284C7" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

    <!-- Step 2 -->
    <rect x="340" y="110" width="240" height="80" rx="8" fill="#FFFFFF" stroke="#0284C7" stroke-width="2" filter="url(#shadow)"/>
    <rect x="340" y="110" width="40" height="80" rx="8" fill="#0284C7"/>
    <text x="360" y="155" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>
    <text x="460" y="140" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#0F172A">aws_internet_gateway</text>
    <text x="460" y="165" font-family="system-ui, sans-serif" font-size="12" fill="#64748B">Conecta a VPC à Internet</text>

    <!-- Arrow 2 to 3 -->
    <path d="M 580 150 L 630 150" stroke="#0284C7" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

    <!-- Step 3 -->
    <rect x="640" y="110" width="240" height="80" rx="8" fill="#FFFFFF" stroke="#0284C7" stroke-width="2" filter="url(#shadow)"/>
    <rect x="640" y="110" width="40" height="80" rx="8" fill="#0284C7"/>
    <text x="660" y="155" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text>
    <text x="760" y="135" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#0F172A">aws_subnet.public</text>
    <text x="760" y="155" font-family="system-ui, sans-serif" font-size="12" fill="#64748B">+ aws_route_table</text>
    <text x="760" y="175" font-family="system-ui, sans-serif" font-size="11" fill="#0284C7">Rota 0.0.0.0/0 -> IGW</text>

    <!-- Connector down -->
    <path d="M 760 190 L 760 250 L 280 250 L 280 290" stroke="#0284C7" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

    <!-- Step 4 -->
    <rect x="40" y="290" width="300" height="90" rx="8" fill="#FFFBEB" stroke="#F59E0B" stroke-width="2" filter="url(#shadow)"/>
    <rect x="40" y="290" width="40" height="90" rx="8" fill="#F59E0B"/>
    <text x="60" y="340" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle">4</text>
    <text x="185" y="320" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#92400E">aws_eip + aws_nat_gateway</text>
    <text x="185" y="345" font-family="system-ui, sans-serif" font-size="11" fill="#78350F">Alocado na Subnet Pública</text>
    <text x="185" y="365" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#D97706">depends_on = [aws_internet_gateway.this]</text>

    <!-- Arrow 4 to 5 -->
    <path d="M 340 335 L 410 335" stroke="#0284C7" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

    <!-- Step 5 -->
    <rect x="420" y="290" width="460" height="90" rx="8" fill="#FFFFFF" stroke="#10B981" stroke-width="2" filter="url(#shadow)"/>
    <rect x="420" y="290" width="40" height="90" rx="8" fill="#10B981"/>
    <text x="440" y="340" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle">5</text>
    <text x="660" y="320" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#065F46">aws_subnet.private + aws_route_table.private</text>
    <text x="660" y="345" font-family="system-ui, sans-serif" font-size="12" fill="#047857">Associa sub-redes privadas e cria rota 0.0.0.0/0 -> NAT Gateway</text>
    <text x="660" y="365" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#059669">Permite saída segura para a internet sem expor instâncias</text>

    <!-- Note footer -->
    <rect x="40" y="420" width="840" height="80" rx="8" fill="#EFF6FF" stroke="#BFDBFE"/>
    <text x="60" y="450" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#1E40AF">Por que o NAT Gateway precisa do Internet Gateway primeiro?</text>
    <text x="60" y="475" font-family="system-ui, sans-serif" font-size="12" fill="#1E3A8A">O NAT Gateway reside na sub-rede pública e necessita do IGW para estabelecer conexão de saída com a internet. Sem o IGW criado previamente, a AWS recusa ou congela o provisionamento do NAT Gateway.</text>
</svg>
