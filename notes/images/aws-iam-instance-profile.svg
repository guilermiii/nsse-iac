<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="100%">
    
    <defs>
        <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#1E293B"/>
            <stop offset="100%" stop-color="#0F172A"/>
        </linearGradient>
        <linearGradient id="awsOrange" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FF9900"/>
            <stop offset="100%" stop-color="#E88200"/>
        </linearGradient>
        <linearGradient id="awsBlue" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0284C7"/>
            <stop offset="100%" stop-color="#0369A1"/>
        </linearGradient>
        <linearGradient id="awsGreen" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#10B981"/>
            <stop offset="100%" stop-color="#047857"/>
        </linearGradient>
        <linearGradient id="awsPurple" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#8B5CF6"/>
            <stop offset="100%" stop-color="#6D28D9"/>
        </linearGradient>
        <linearGradient id="awsRed" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#EF4444"/>
            <stop offset="100%" stop-color="#B91C1C"/>
        </linearGradient>
        <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
            <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.08" flood-color="#0F172A"/>
        </filter>
        <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284C7" />
        </marker>
        <marker id="arrowOrange" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#FF9900" />
        </marker>
        <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#10B981" />
        </marker>
        <marker id="arrowRed" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#EF4444" />
        </marker>
    </defs>

    <rect width="900" height="480" fill="#F8FAFC" rx="12"/>
    <text x="450" y="45" font-family="system-ui, sans-serif" font-size="22" font-weight="bold" fill="#0F172A" text-anchor="middle">IAM Instance Profile &amp; Role: Segurança sem Secrets Estáticos</text>
    <text x="450" y="70" font-family="system-ui, sans-serif" font-size="14" fill="#64748B" text-anchor="middle">Como instâncias EC2 assumem permissões dinâmicas via AWS STS</text>

    <!-- EC2 Node -->
    <rect x="60" y="140" width="180" height="180" rx="10" fill="#FFFFFF" stroke="#EC7211" stroke-width="2" filter="url(#shadow)"/>
    <text x="150" y="175" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#C2410C" text-anchor="middle">Instância EC2</text>
    <text x="150" y="200" font-family="system-ui, sans-serif" font-size="11" fill="#64748B" text-anchor="middle">(Debian / Worker)</text>
    <rect x="80" y="225" width="140" height="60" rx="6" fill="#FEE2E2" stroke="#EF4444"/>
    <text x="150" y="248" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#991B1B" text-anchor="middle">ZERO Segredos</text>
    <text x="150" y="265" font-family="system-ui, sans-serif" font-size="9" fill="#7F1D1D" text-anchor="middle">Nenhum Access Key</text>
    <text x="150" y="278" font-family="system-ui, sans-serif" font-size="9" fill="#7F1D1D" text-anchor="middle">gravado no disco</text>

    <!-- Arrow EC2 to Instance Profile -->
    <path d="M 240 230 L 320 230" stroke="#0284C7" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="280" y="220" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#0284C7" text-anchor="middle">Anexa</text>

    <!-- Instance Profile -->
    <rect x="330" y="140" width="190" height="180" rx="10" fill="#FFFFFF" stroke="#0284C7" stroke-width="2" filter="url(#shadow)"/>
    <text x="425" y="175" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#0369A1" text-anchor="middle">Instance Profile</text>
    <text x="425" y="200" font-family="system-ui, sans-serif" font-size="11" fill="#64748B" text-anchor="middle">(Contêiner da Role)</text>
    <rect x="350" y="225" width="150" height="65" rx="6" fill="#E0F2FE"/>
    <text x="425" y="250" font-family="system-ui, sans-serif" font-size="10" fill="#0369A1" text-anchor="middle">A EC2 não assume</text>
    <text x="425" y="267" font-family="system-ui, sans-serif" font-size="10" fill="#0369A1" text-anchor="middle">uma role direta; exige</text>
    <text x="425" y="284" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#0369A1" text-anchor="middle">o Instance Profile</text>

    <!-- Arrow Profile to Role -->
    <path d="M 520 230 L 600 230" stroke="#0284C7" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="560" y="220" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#0284C7" text-anchor="middle">Assume</text>

    <!-- IAM Role -->
    <rect x="610" y="140" width="230" height="180" rx="10" fill="#FFFFFF" stroke="#8B5CF6" stroke-width="2" filter="url(#shadow)"/>
    <text x="725" y="175" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#6D28D9" text-anchor="middle">IAM Role</text>
    <text x="725" y="200" font-family="system-ui, sans-serif" font-size="11" fill="#64748B" text-anchor="middle">Trust: ec2.amazonaws.com</text>
    <rect x="630" y="220" width="190" height="75" rx="6" fill="#EDE9FE"/>
    <text x="725" y="245" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#5B21B6" text-anchor="middle">Permissão SSM:</text>
    <text x="725" y="265" font-family="system-ui, sans-serif" font-size="9" fill="#6D28D9" text-anchor="middle">AmazonSSMManagedInstanceCore</text>
    <text x="725" y="282" font-family="system-ui, sans-serif" font-size="9" fill="#15803D" text-anchor="middle">Credenciais temporárias STS</text>

    <!-- Bottom Flow Explanation -->
    <rect x="60" y="360" width="780" height="85" rx="8" fill="#F8FAFC" stroke="#CBD5E1"/>
    <text x="80" y="390" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#0F172A">Como a aplicação consome essas credenciais:</text>
    <text x="80" y="415" font-family="system-ui, sans-serif" font-size="11" fill="#475569">O AWS SDK busca tokens temporários diretamente no Instance Metadata Service (IMDSv2 em 169.254.169.254).</text>
    <text x="80" y="432" font-family="system-ui, sans-serif" font-size="11" fill="#475569">Esses tokens são rotacionados automaticamente de forma invisível para o sistema operacional.</text>
</svg>
