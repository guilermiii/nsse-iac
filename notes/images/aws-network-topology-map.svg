<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 560" width="100%" height="100%">
    
    <defs>
        <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#1E293B"/>
            <stop offset="100%" stop-color="#0F172A"/>
        </linearGradient>
        <linearGradient id="awsOrange" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FF9900"/>
            <stop offset="100%" stop-color="#E88200"/>
        </linearGradient>
        <linearGradient id="awsBlue" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0284C7"/>
            <stop offset="100%" stop-color="#0369A1"/>
        </linearGradient>
        <linearGradient id="awsGreen" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#10B981"/>
            <stop offset="100%" stop-color="#047857"/>
        </linearGradient>
        <linearGradient id="awsPurple" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#8B5CF6"/>
            <stop offset="100%" stop-color="#6D28D9"/>
        </linearGradient>
        <linearGradient id="awsRed" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#EF4444"/>
            <stop offset="100%" stop-color="#B91C1C"/>
        </linearGradient>
        <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
            <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.08" flood-color="#0F172A"/>
        </filter>
        <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284C7" />
        </marker>
        <marker id="arrowOrange" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#FF9900" />
        </marker>
        <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#10B981" />
        </marker>
        <marker id="arrowRed" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#EF4444" />
        </marker>
    </defs>

    <rect width="940" height="560" fill="#F8FAFC" rx="12"/>
    <text x="470" y="40" font-family="system-ui, sans-serif" font-size="22" font-weight="bold" fill="#0F172A" text-anchor="middle">Topologia Completa de Rede - Projeto NSSE</text>
    <text x="470" y="65" font-family="system-ui, sans-serif" font-size="14" fill="#64748B" text-anchor="middle">Visão integrada de VPC, IGW, NAT Gateways, Subnets e Associações de Rota</text>

    <!-- Internet -->
    <rect x="400" y="90" width="140" height="40" rx="20" fill="#0284C7"/>
    <text x="470" y="115" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">🌐 Internet</text>

    <path d="M 470 130 L 470 160" stroke="#0284C7" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Internet Gateway -->
    <rect x="360" y="160" width="220" height="45" rx="8" fill="#FFFBEB" stroke="#F59E0B" stroke-width="2"/>
    <text x="470" y="187" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#92400E" text-anchor="middle">Internet Gateway (IGW)</text>

    <!-- VPC Enclosure -->
    <rect x="40" y="230" width="860" height="300" rx="10" fill="#FFFFFF" stroke="#FF9900" stroke-width="2" filter="url(#shadow)"/>
    <text x="65" y="255" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#92400E">VPC nsse-vpc (10.0.0.0/24)</text>

    <!-- Lines from IGW to Public Subnets -->
    <path d="M 420 205 L 240 270" stroke="#0284C7" stroke-width="1.5" stroke-dasharray="3,3"/>
    <path d="M 520 205 L 700 270" stroke="#0284C7" stroke-width="1.5" stroke-dasharray="3,3"/>

    <!-- Public Subnet A -->
    <rect x="65" y="270" width="380" height="100" rx="6" fill="#EFF6FF" stroke="#3B82F6"/>
    <text x="80" y="295" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#1D4ED8">Subnet Pública us-east-1a (10.0.0.0/27)</text>
    <rect x="80" y="310" width="180" height="45" rx="4" fill="#DBEAFE"/>
    <text x="170" y="337" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#1E40AF" text-anchor="middle">NAT Gateway A (EIP)</text>

    <!-- Public Subnet B -->
    <rect x="495" y="270" width="380" height="100" rx="6" fill="#EFF6FF" stroke="#3B82F6"/>
    <text x="510" y="295" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#1D4ED8">Subnet Pública us-east-1b (10.0.0.64/27)</text>
    <rect x="510" y="310" width="180" height="45" rx="4" fill="#DBEAFE"/>
    <text x="600" y="337" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#1E40AF" text-anchor="middle">NAT Gateway B (EIP)</text>

    <!-- Lines from NAT GW to Private Subnets -->
    <path d="M 170 355 L 170 395" stroke="#10B981" stroke-width="2" marker-end="url(#arrowGreen)"/>
    <path d="M 600 355 L 600 395" stroke="#10B981" stroke-width="2" marker-end="url(#arrowGreen)"/>

    <!-- Private Subnet A -->
    <rect x="65" y="400" width="380" height="110" rx="6" fill="#F0FDF4" stroke="#10B981"/>
    <text x="80" y="425" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#065F46">Subnet Privada us-east-1a (10.0.0.32/27)</text>
    <rect x="80" y="440" width="220" height="55" rx="4" fill="#DCFCE7"/>
    <text x="190" y="465" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#15803D" text-anchor="middle">EC2 Control Plane (ASG)</text>
    <text x="190" y="482" font-family="system-ui, sans-serif" font-size="10" fill="#166534" text-anchor="middle">Rota 0.0.0.0/0 -> NAT GW A</text>

    <!-- Private Subnet B -->
    <rect x="495" y="400" width="380" height="110" rx="6" fill="#F0FDF4" stroke="#10B981"/>
    <text x="510" y="425" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#065F46">Subnet Privada us-east-1b (10.0.0.96/27)</text>
    <rect x="510" y="440" width="220" height="55" rx="4" fill="#DCFCE7"/>
    <text x="620" y="465" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#15803D" text-anchor="middle">EC2 Worker Nodes (ASG)</text>
    <text x="620" y="482" font-family="system-ui, sans-serif" font-size="10" fill="#166534" text-anchor="middle">Rota 0.0.0.0/0 -> NAT GW B</text>
</svg>
