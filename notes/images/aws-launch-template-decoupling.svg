<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 500" width="100%" height="100%">
    
    <defs>
        <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#1E293B"/>
            <stop offset="100%" stop-color="#0F172A"/>
        </linearGradient>
        <linearGradient id="awsOrange" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FF9900"/>
            <stop offset="100%" stop-color="#E88200"/>
        </linearGradient>
        <linearGradient id="awsBlue" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0284C7"/>
            <stop offset="100%" stop-color="#0369A1"/>
        </linearGradient>
        <linearGradient id="awsGreen" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#10B981"/>
            <stop offset="100%" stop-color="#047857"/>
        </linearGradient>
        <linearGradient id="awsPurple" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#8B5CF6"/>
            <stop offset="100%" stop-color="#6D28D9"/>
        </linearGradient>
        <linearGradient id="awsRed" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#EF4444"/>
            <stop offset="100%" stop-color="#B91C1C"/>
        </linearGradient>
        <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
            <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.08" flood-color="#0F172A"/>
        </filter>
        <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284C7" />
        </marker>
        <marker id="arrowOrange" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#FF9900" />
        </marker>
        <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#10B981" />
        </marker>
        <marker id="arrowRed" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#EF4444" />
        </marker>
    </defs>

    <rect width="920" height="500" fill="#F8FAFC" rx="12"/>
    <text x="460" y="45" font-family="system-ui, sans-serif" font-size="22" font-weight="bold" fill="#0F172A" text-anchor="middle">Launch Template vs Auto Scaling Group: Desacoplamento</text>
    <text x="460" y="70" font-family="system-ui, sans-serif" font-size="14" fill="#64748B" text-anchor="middle">Separação de responsabilidades: Especificação da Máquina vs Gerenciamento do Pool</text>

    <!-- Launch Template (O QUE) -->
    <rect x="60" y="110" width="370" height="340" rx="10" fill="#FFFFFF" stroke="#0284C7" stroke-width="2" filter="url(#shadow)"/>
    <rect x="60" y="110" width="370" height="42" rx="10" fill="#E0F2FE"/>
    <text x="245" y="137" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#0369A1" text-anchor="middle">Launch Template (O QUE provisionar)</text>

    <text x="85" y="180" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#1E293B">Configurações intrínsecas da máquina:</text>

    <rect x="85" y="200" width="320" height="40" rx="6" fill="#F8FAFC" stroke="#CBD5E1"/>
    <text x="100" y="225" font-family="system-ui, sans-serif" font-size="12" fill="#334155">🖥️ Tipo de Instância: t3.micro</text>

    <rect x="85" y="250" width="320" height="40" rx="6" fill="#F8FAFC" stroke="#CBD5E1"/>
    <text x="100" y="275" font-family="system-ui, sans-serif" font-size="12" fill="#334155">💿 Disco EBS: 20GB (delete_on_termination)</text>

    <rect x="85" y="300" width="320" height="40" rx="6" fill="#F8FAFC" stroke="#CBD5E1"/>
    <text x="100" y="325" font-family="system-ui, sans-serif" font-size="12" fill="#334155">🔑 Key Pair + IAM Instance Profile</text>

    <rect x="85" y="350" width="320" height="40" rx="6" fill="#F8FAFC" stroke="#CBD5E1"/>
    <text x="100" y="375" font-family="system-ui, sans-serif" font-size="12" fill="#334155">📜 User Data: Instalação do SSM Agent</text>

    <text x="245" y="425" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#DC2626" text-anchor="middle">⚠️ NÃO define sub-redes nem IPs aqui!</text>

    <!-- Arrow between them -->
    <path d="M 430 280 L 490 280" stroke="#0284C7" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
    <text x="460" y="265" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#0284C7" text-anchor="middle">Utiliza</text>

    <!-- ASG (ONDE e QUANTO) -->
    <rect x="490" y="110" width="370" height="340" rx="10" fill="#FFFFFF" stroke="#FF9900" stroke-width="2" filter="url(#shadow)"/>
    <rect x="490" y="110" width="370" height="42" rx="10" fill="#FEF3C7"/>
    <text x="675" y="137" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#92400E" text-anchor="middle">Auto Scaling Group (ONDE e QUANTO)</text>

    <text x="515" y="180" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#1E293B">Gerenciamento dinâmico do cluster:</text>

    <rect x="515" y="200" width="320" height="40" rx="6" fill="#F8FAFC" stroke="#CBD5E1"/>
    <text x="530" y="225" font-family="system-ui, sans-serif" font-size="12" fill="#334155">🌐 Subnets da VPC: vpc_zone_identifier</text>

    <rect x="515" y="250" width="320" height="40" rx="6" fill="#F8FAFC" stroke="#CBD5E1"/>
    <text x="530" y="275" font-family="system-ui, sans-serif" font-size="12" fill="#334155">📊 Capacidade: Min / Desejada / Max</text>

    <rect x="515" y="300" width="320" height="40" rx="6" fill="#F8FAFC" stroke="#CBD5E1"/>
    <text x="530" y="325" font-family="system-ui, sans-serif" font-size="12" fill="#334155">🩺 Health Check: Tipo EC2 / ELB</text>

    <rect x="515" y="350" width="320" height="40" rx="6" fill="#F0FDF4" stroke="#16A34A"/>
    <text x="530" y="375" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#15803D">⚙️ instance_maintenance_policy</text>

    <text x="675" y="425" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#15803D" text-anchor="middle">✓ Garante Alta Disponibilidade Multi-AZ</text>
</svg>
