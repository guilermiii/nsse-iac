<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 540" width="100%" height="100%">
    
    <defs>
        <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#1E293B"/>
            <stop offset="100%" stop-color="#0F172A"/>
        </linearGradient>
        <linearGradient id="awsOrange" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FF9900"/>
            <stop offset="100%" stop-color="#E88200"/>
        </linearGradient>
        <linearGradient id="awsBlue" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0284C7"/>
            <stop offset="100%" stop-color="#0369A1"/>
        </linearGradient>
        <linearGradient id="awsGreen" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#10B981"/>
            <stop offset="100%" stop-color="#047857"/>
        </linearGradient>
        <linearGradient id="awsPurple" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#8B5CF6"/>
            <stop offset="100%" stop-color="#6D28D9"/>
        </linearGradient>
        <linearGradient id="awsRed" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#EF4444"/>
            <stop offset="100%" stop-color="#B91C1C"/>
        </linearGradient>
        <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
            <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.08" flood-color="#0F172A"/>
        </filter>
        <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284C7" />
        </marker>
        <marker id="arrowOrange" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#FF9900" />
        </marker>
        <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#10B981" />
        </marker>
        <marker id="arrowRed" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#EF4444" />
        </marker>
    </defs>

    <rect width="920" height="540" fill="#F8FAFC" rx="12"/>
    <text x="460" y="45" font-family="system-ui, sans-serif" font-size="22" font-weight="bold" fill="#0F172A" text-anchor="middle">Endereçamento CIDR e os 5 IPs Reservados da AWS</text>
    <text x="460" y="70" font-family="system-ui, sans-serif" font-size="14" fill="#64748B" text-anchor="middle">Divisão da VPC 10.0.0.0/24 em sub-redes /27 (32 IPs brutos cada)</text>

    <!-- Subnets Layout -->
    <rect x="40" y="100" width="400" height="170" rx="8" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
    <text x="60" y="128" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1E40AF">Subnet Pública A (us-east-1a)</text>
    <text x="60" y="150" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#2563EB">10.0.0.0/27</text>
    <text x="60" y="175" font-family="system-ui, sans-serif" font-size="12" fill="#475569">Intervalo: 10.0.0.0 até 10.0.0.31</text>
    <text x="60" y="195" font-family="system-ui, sans-serif" font-size="12" fill="#475569">IPs Brutos: 32 | IPs Úteis: 27</text>
    <rect x="60" y="215" width="150" height="28" rx="4" fill="#DBEAFE"/>
    <text x="135" y="234" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#1D4ED8" text-anchor="middle">NAT Gateway A + EIP</text>

    <rect x="480" y="100" width="400" height="170" rx="8" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
    <text x="500" y="128" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1E40AF">Subnet Pública B (us-east-1b)</text>
    <text x="500" y="150" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#2563EB">10.0.0.64/27</text>
    <text x="500" y="175" font-family="system-ui, sans-serif" font-size="12" fill="#475569">Intervalo: 10.0.0.64 até 10.0.0.95</text>
    <text x="500" y="195" font-family="system-ui, sans-serif" font-size="12" fill="#475569">IPs Brutos: 32 | IPs Úteis: 27</text>
    <rect x="500" y="215" width="150" height="28" rx="4" fill="#DBEAFE"/>
    <text x="575" y="234" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#1D4ED8" text-anchor="middle">NAT Gateway B + EIP</text>

    <rect x="40" y="290" width="400" height="100" rx="8" fill="#F0FDF4" stroke="#10B981" stroke-width="2"/>
    <text x="60" y="318" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#065F46">Subnet Privada A (us-east-1a)</text>
    <text x="60" y="340" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#059669">10.0.0.32/27</text>
    <text x="60" y="365" font-family="system-ui, sans-serif" font-size="12" fill="#475569">Intervalo: 10.0.0.32 até 10.0.0.63 | 27 IPs úteis (EC2 Workers)</text>

    <rect x="480" y="290" width="400" height="100" rx="8" fill="#F0FDF4" stroke="#10B981" stroke-width="2"/>
    <text x="500" y="318" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#065F46">Subnet Privada B (us-east-1b)</text>
    <text x="500" y="340" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#059669">10.0.0.96/27</text>
    <text x="500" y="365" font-family="system-ui, sans-serif" font-size="12" fill="#475569">Intervalo: 10.0.0.96 até 10.0.0.127 | 27 IPs úteis (EC2 Workers)</text>

    <!-- 5 Reserved IPs Box -->
    <rect x="40" y="410" width="840" height="110" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="60" y="435" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#0F172A">⚠️ Os 5 Endereços IP Reservados pela AWS em QUALQUER Sub-rede (Exemplo para 10.0.0.0/27):</text>

    <text x="60" y="465" font-family="system-ui, sans-serif" font-size="12" fill="#B91C1C" font-weight="bold">10.0.0.0</text>
    <text x="130" y="465" font-family="system-ui, sans-serif" font-size="12" fill="#475569">→ Endereço de Rede (Network ID)</text>

    <text x="350" y="465" font-family="system-ui, sans-serif" font-size="12" fill="#B91C1C" font-weight="bold">10.0.0.1</text>
    <text x="420" y="465" font-family="system-ui, sans-serif" font-size="12" fill="#475569">→ Roteador Virtual da VPC</text>

    <text x="630" y="465" font-family="system-ui, sans-serif" font-size="12" fill="#B91C1C" font-weight="bold">10.0.0.2</text>
    <text x="700" y="465" font-family="system-ui, sans-serif" font-size="12" fill="#475569">→ Servidor DNS AWS</text>

    <text x="60" y="495" font-family="system-ui, sans-serif" font-size="12" fill="#B91C1C" font-weight="bold">10.0.0.3</text>
    <text x="130" y="495" font-family="system-ui, sans-serif" font-size="12" fill="#475569">→ Reservado para uso futuro pela AWS</text>

    <text x="420" y="495" font-family="system-ui, sans-serif" font-size="12" fill="#B91C1C" font-weight="bold">10.0.0.31</text>
    <text x="495" y="495" font-family="system-ui, sans-serif" font-size="12" fill="#475569">→ Broadcast (não suportado, mas reservado)</text>
</svg>
